<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg-icon { fill: #111827; }
      .bg-text { font-family: 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 4.5px; fill: #111827; text-anchor: middle; }
      .b-letter { font-family: 'Playfair Display', 'Georgia', serif; font-style: italic; font-weight: 700; font-size: 68px; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Group: Newspaper Emblem -->
  <g transform="translate(115, 60)">
    <!-- Back / Left Folded Page -->
    <path class="bg-icon" d="M 0,40 L 40,40 L 40,200 C 40,215 25,230 0,230 C -20,230 -35,215 -35,190 L -35,80 C -35,55 -20,40 0,40 Z" />
    
    <!-- Outer Newspaper Outline / Solid Shell -->
    <path class="bg-icon" d="M 5,0 L 260,0 C 270,0 275,5 275,15 L 275,230 C 275,240 270,245 260,245 L 25,245 C 5,245 -10,235 -10,215 L -10,195 C -10,210 5,225 25,225 L 255,225 L 255,20 L 5,20 Z" />
    
    <!-- Header Top Headline Bar -->
    <rect class="bg-icon" x="50" y="52" width="145" height="15" rx="3" />
    
    <!-- Left 4 Text Lines -->
    <rect class="bg-icon" x="35" y="90" width="60" height="9" rx="2" />
    <rect class="bg-icon" x="35" y="112" width="60" height="9" rx="2" />
    <rect class="bg-icon" x="35" y="134" width="60" height="9" rx="2" />
    <rect class="bg-icon" x="35" y="156" width="60" height="9" rx="2" />
    
    <!-- Right Photo / Logo Box -->
    <rect class="bg-icon" x="110" y="88" width="90" height="78" rx="2" />
    
    <!-- Cursive 'B' inside Right Box -->
    <text class="b-letter" x="155" y="127">B</text>
  </g>

  <!-- Typography: BENGAL PRESS & MEDIA WORLD LTD -->
  <text class="bg-text" x="250" y="380">BENGAL PRESS &amp; MEDIA WORLD LTD</text>
</svg>
